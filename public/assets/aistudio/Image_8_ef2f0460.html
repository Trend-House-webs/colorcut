<div class="flex-1 flex items-center gap-1.5 px-3 h-9 bg-surface-container-lowest rounded-lg border border-border-subtle focus-within:border-primary-container focus-within:ring-1 focus-within:ring-primary-container transition-all">
<span class="text-secondary font-label-mono text-label-mono">#</span>
<input class="w-full bg-transparent p-0 border-none font-label-mono text-label-mono text-on-surface focus:ring-0 uppercase tracking-wider" id="hex-input" maxlength="6" placeholder="HEX" type="text" value="2563EB"/>
</div>
<button class="h-9 px-3 rounded-lg bg-surface-container-lowest border border-border-subtle flex items-center justify-center text-secondary hover:text-on-surface hover:bg-surface-container active:scale-95 transition-all gap-1 text-label-sm font-label-sm font-semibold" id="btn-eyedropper" title="Pick Screen Color">
<span class="material-symbols-outlined text-[16px] text-primary" data-icon="colorize">colorize</span>
<span>Sample</span>
</button>
</div>
</section>
<!-- 4. Mobile Sticky Download Action Bar -->
<footer class="sticky bottom-0 z-40 bg-surface-container-lowest border-t border-border-subtle p-4 flex flex-col gap-2.5 elevation-level-2">
<!-- Stacked Primary Buttons -->
<!-- Primary 1: Transparent PNG Download -->
<button class="w-full h-12 rounded-xl bg-primary-container hover:bg-primary text-on-primary font-headline-sm text-headline-sm font-semibold flex items-center justify-center gap-2 shadow-md hover:shadow-lg active:scale-[0.98] transition-all duration-150 touch-manipulation" id="btn-download-png">
<span class="material-symbols-outlined text-[20px]" data-icon="download">download</span>
<span>Download PNG — Transparent</span>
</button>
<!-- Primary 2: Color JPG Download -->
<button class="w-full h-12 rounded-xl bg-surface-container-lowest border border-border-subtle hover:border-border-hover hover:bg-surface-canvas text-on-surface font-headline-sm text-headline-sm font-semibold flex items-center justify-center gap-2 shadow-sm active:scale-[0.98] transition-all duration-150 touch-manipulation" id="btn-download-jpg">
<span class="material-symbols-outlined text-[20px] text-primary" data-icon="image">image</span>
<span id="jpg-button-label">Download JPG — Selected Color</span>
</button>
<!-- Value Proposition Microcopy -->
<div class="flex items-center justify-center gap-2 pt-1">
<span class="material-symbols-outlined text-[15px] text-success-emerald" data-icon="check_circle">check_circle</span>
<span class="font-body-sm text-[11px] text-secondary">Instant download • No watermark • 100% Free</span>
</div>
</footer>
</main>
<!-- Interactive Logic for Real-Time Mobile Simulation -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
      const canvasBgLayer = document.getElementById('canvas-bg-layer');
      const activeColorIndicator = document.getElementById('active-color-indicator');
      const activeColorName = document.getElementById('active-color-name');
      const hexInput = document.getElementById('hex-input');
      const customColorPicker = document.getElementById('custom-hex-color');
      const customPreviewBox = document.getElementById('custom-preview-box');
      const swatchBtns = document.querySelectorAll('.swatch-btn');
      const jpgButtonLabel = document.getElementById('jpg-button-label');
      
      // Compare Before/After Elements
      const btnCompare = document.getElementById('btn-compare');
      const originalSubject = document.getElementById('original-subject');
      
      // Set active color helper
      function applyColor(colorValue, colorLabel) {
        // Clear all swatch rings and checks
        swatchBtns.forEach(btn => {
          btn.classList.remove('ring-2', 'ring-primary', 'ring-offset-2', 'ring-offset-surface-container-lowest');
          const check = btn.querySelector('.swatch-check');
          if (check) check.classList.add('hidden');
        });

        if (colorValue === 'transparent') {
          canvasBgLayer.className = 'absolute inset-0 bg-checkerboard transition-colors duration-200';
          canvasBgLayer.style.backgroundColor = '';
          activeColorIndicator.className = 'w-3.5 h-3.5 rounded-full bg-checkerboard-sm border border-border-subtle';
          activeColorIndicator.style.backgroundColor = '';
          activeColorName.textContent = 'Transparent';
          jpgButtonLabel.textContent = 'Download JPG — Solid White';
        } else {
          canvasBgLayer.className = 'absolute inset-0 transition-colors duration-200';
          canvasBgLayer.style.backgroundColor = colorValue;
          activeColorIndicator.className = 'w-3.5 h-3.5 rounded-full border border-border-subtle';
          activeColorIndicator.style.backgroundColor = colorValue;
          activeColorName.textContent = colorLabel || colorValue;
          jpgButtonLabel.textContent = `Download JPG — ${colorLabel || colorValue}`;
        }
      }

      // Swatch Click Listeners
      swatchBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          const color = btn.getAttribute('data-color');
          const name = btn.getAttribute('data-name');
          applyColor(color, name);

          btn.classList.add('ring-2', 'ring-primary', 'ring-offset-2', 'ring-offset-surface-container-lowest');
          const check = btn.querySelector('.swatch-check');
          if (check) check.classList.remove('hidden');

          if (color !== 'transparent') {
            hexInput.value = color.replace('#', '').toUpperCase();
            customColorPicker.value = color;
            customPreviewBox.style.backgroundColor = color;
          }
        });
      });

      // Custom Color Picker Change
      customColorPicker.addEventListener('input', (e) => {
        const val = e.target.value.toUpperCase();
        hexInput.value = val.replace('#', '');
        customPreviewBox.style.backgroundColor = val;
        applyColor(val, val);
      });

      // Hex Input Field Change
      hexInput.addEventListener('input', (e) => {
        let val = e.target.value.replace(/[^0-9A-Fa-f]/g, '');
        e.target.value = val;
        if (val.length === 6) {
          const fullHex = '#' + val;
          customColorPicker.value = fullHex;
          customPreviewBox.style.backgroundColor = fullHex;
          applyColor(fullHex, fullHex);
        }
      });

      // Hold to Compare Interaction (Touch & Mouse events)
      const showOriginal = () => {
        originalSubject.classList.remove('opacity-0');
        originalSubject.classList.add('opacity-100');
        btnCompare.classList.add('bg-primary-container', 'text-on-primary');
      };

      const hideOriginal = () => {
        originalSubject.classList.remove('opacity-100');
        originalSubject.classList.add('opacity-0');
        btnCompare.classList.remove('bg-primary-container', 'text-on-primary');
      };

      btnCompare.addEventListener('mousedown', showOriginal);
      btnCompare.addEventListener('mouseup', hideOriginal);
      btnCompare.addEventListener('mouseleave', hideOriginal);
      btnCompare.addEventListener('touchstart', (e) => { e.preventDefault(); showOriginal(); });
      btnCompare.addEventListener('touchend', hideOriginal);

      // EyeDropper API fallback
      const btnEyedropper = document.getElementById('btn-eyedropper');
      btnEyedropper.addEventListener('click', async () => {
        if ('EyeDropper' in window) {
          try {
            const eyeDropper = new EyeDropper();
            const result = await eyeDropper.open();
            const pickedColor = result.sRGBHex.toUpperCase();
            hexInput.value = pickedColor.replace('#', '');
            customColorPicker.value = pickedColor;
            customPreviewBox.style.backgroundColor = pickedColor;
            applyColor(pickedColor, pickedColor);
          } catch (e) {
            // User cancelled or unsupported
          }
        } else {
          customColorPicker.click();
        }
      });

      // Simple Feedback Toast on Download Simulation
      function simulateDownload(format) {
        const toast = document.createElement('div');
        toast.className = 'fixed bottom-28 z-50 bg-inverse-surface text-inverse-on-surface px-4 py-2 rounded-xl shadow-lg flex items-center gap-2 font-label-md transition-all duration-300 transform translate-y-4 opacity-0 pointer-events-none';
        toast.innerHTML = `<span class="material-symbols-outlined text-[18px] text-success-emerald">check_circle</span> Downloading high-res ${format}...`;
        document.body.appendChild(toast);
        
        requestAnimationFrame(() => {
          toast.classList.remove('translate-y-4', 'opacity-0');
          toast.classList.add('translate-y-0', 'opacity-100');
        });

        setTimeout(() => {
          toast.classList.add('opacity-0', 'translate-y-4');
          setTimeout(() => toast.remove(), 300);
        }, 2200);
      }

      document.getElementById('btn-download-png').addEventListener('click', () => simulateDownload('PNG (Transparent)'));
      document.getElementById('btn-download-jpg').addEventListener('click', () => simulateDownload('JPG (Color Background)'));
    });
  </script>
</body></html>
